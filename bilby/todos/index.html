<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bilby Action Items</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f2ef; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .frame-wrap { position: fixed; inset: 0; }
  iframe { border: 0; width: 100%; height: 100%; display: block; background: #f5f2ef; }
  .loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #8b1f27; font-size: 14px; letter-spacing: 1px; text-transform: uppercase;
    background: #f5f2ef;
    transition: opacity 0.3s;
    z-index: 1;
  }
  .loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid #efd7d7; border-top-color: #8b1f27;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="loading" id="loading"><div class="spinner"></div>Loading action items…</div>
<div class="frame-wrap">
  <iframe id="app" src="https://bilby-todos.fly.dev/" title="Bilby Action Items"></iframe>
</div>
<script>
  const iframe = document.getElementById("app");
  const loading = document.getElementById("loading");
  iframe.addEventListener("load", () => loading.classList.add("hidden"));
  setTimeout(() => loading.classList.add("hidden"), 8000);
</script>
</body>
</html>
